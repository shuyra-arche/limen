[workspace]
resolver = "3"
members = ["server", "server/tests/basis/sync/host", "server/tests/entry/boot/host", "server/tests/metal/**/host"]

[workspace.package]
version = "0.0.1"
edition = "2024"

[workspace.dependencies]
bitflags = "2.13.1"

[profile.dev]
debug = true
panic = "abort"

[profile.release]
panic = "abort"
