name: Target

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  target:
    name: ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64, x86_64]
        profile: [debug, release]
    env:
      LIMEN_TEST_ARCH: ${{ matrix.arch }}
      LIMEN_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential jq gdb-multiarch
          case "$LIMEN_TEST_ARCH" in
            riscv64) qemu=qemu-system-riscv; firmware=opensbi ;;
            aarch64) qemu=qemu-system-arm; firmware=qemu-efi-aarch64 ;;
            x86_64) qemu=qemu-system-x86; firmware=ovmf ;;
          esac
          apt-get install -y --no-install-recommends "$firmware"
          echo 'deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://snapshot.debian.org/archive/debian/20261124T000000Z/ trixie-backports main' > /etc/apt/sources.list.d/qemu.list
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends -t trixie-backports "$qemu"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          case "$LIMEN_TEST_ARCH" in
            riscv64) target=riscv64gc-unknown-none-elf ;;
            aarch64) target=aarch64-unknown-uefi ;;
            x86_64) target=x86_64-unknown-uefi ;;
          esac
          rustup target add "$target"
          echo "LIMEN_TEST_TARGET=$target" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record source
        run: |
          mkdir -p .integration
          git -c safe.directory="$PWD" rev-parse HEAD > .integration/source.txt
          rustc -Vv > .integration/rustc.txt
          cargo -V > .integration/cargo.txt
      - name: Run target tests
        shell: bash
        run: |
          set -euo pipefail
          runner_manifest=server/tests/runner/Cargo.toml
          guest_manifest=server/tests/target/Cargo.toml
          host=x86_64-unknown-linux-gnu
          cargo build --locked --manifest-path "$runner_manifest" -p kernel-verification --target "$host"
          export LIMEN_TEST_RUNNER="$PWD/server/tests/runner/target/$host/debug/verify"
          evidence="$PWD/.integration/guests"
          config="target.$LIMEN_TEST_TARGET.runner=['$LIMEN_TEST_RUNNER','native','--evidence-root','$evidence']"
          profile=()
          if [[ "$LIMEN_TEST_PROFILE" == release ]]; then profile+=(--release); fi

          # Host observers select the actual guest environment, not the host ISA.
          cargo test --locked --manifest-path "$runner_manifest" \
            -p machine-observer --target "$host" --tests -- --test-threads=1

          # Only the shared and actual ISA-specific guest packages are compiled.
          # Every Cargo-discovered integration test in those packages runs.
          cargo -Z panic-abort-tests --config "$config" test --locked \
            --manifest-path "$guest_manifest" -p kernel-guest -p "$LIMEN_TEST_ARCH-guest" \
            --target "$LIMEN_TEST_TARGET" --tests "${profile[@]}"

          # Ordinary UEFI guests built and ran without the extra bare target.
          # Only the independent Module ELF images need that dependency.
          if [[ "$LIMEN_TEST_TARGET" == *-uefi ]]; then
            rustup target add "${LIMEN_TEST_ARCH}-unknown-none"
          fi
          cargo -Z panic-abort-tests --config "$config" test --locked \
            --manifest-path "$guest_manifest" -p module-guest \
            --target "$LIMEN_TEST_TARGET" --tests "${profile[@]}"
      - name: Preserve target evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: target-${{ matrix.arch }}-${{ matrix.profile }}
          path: .integration/
          include-hidden-files: true
          if-no-files-found: warn
