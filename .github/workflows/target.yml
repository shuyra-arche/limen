name: Target

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  target:
    name: ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64, x86_64]
        profile: [debug, release]
    env:
      LIMEN_TEST_ARCH: ${{ matrix.arch }}
      LIMEN_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install base tools
        id: base_tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential jq gdb-multiarch
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install QEMU and firmware
        id: tools
        shell: bash
        run: bash server/tests/runner/ci/qemu.sh "$LIMEN_TEST_ARCH"
      - name: Install pinned toolchain
        id: toolchain
        shell: bash
        run: bash server/tests/runner/ci/toolchain.sh "$LIMEN_TEST_ARCH"
      - name: Record source
        id: source
        run: |
          mkdir -p .integration
          git -c safe.directory="$PWD" rev-parse HEAD > .integration/source.txt
          rustc -Vv > .integration/rustc.txt
          cargo -V > .integration/cargo.txt
      - name: Prepare target runner
        id: runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .integration/stages
          host=x86_64-unknown-linux-gnu
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml \
            -p kernel-verification --target "$host" 2>&1 | tee .integration/stages/runner.log
          runner="$PWD/server/tests/runner/target/$host/debug/verify"
          echo "LIMEN_TEST_RUNNER=$runner" >> "$GITHUB_ENV"

      # Each stage depends on the prepared runner, not the verdict of another
      # stage. A failed step still fails the job; no continue-on-error is used.
      - name: Run Host observers
        id: observers
        if: ${{ !cancelled() && steps.runner.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml \
            -p machine-observer --target x86_64-unknown-linux-gnu \
            --tests --no-fail-fast -- --test-threads=1 \
            2>&1 | tee .integration/stages/observers.log

      - name: Run ordinary guests
        id: guests
        if: ${{ !cancelled() && steps.runner.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/.integration/guests"
          config="target.$LIMEN_TEST_TARGET.runner=['$LIMEN_TEST_RUNNER','native','--evidence-root','$evidence']"
          profile=()
          if [[ "$LIMEN_TEST_PROFILE" == release ]]; then profile+=(--release); fi
          cargo -Z panic-abort-tests --config "$config" test --locked \
            --manifest-path server/tests/target/Cargo.toml -p kernel-guest -p "$LIMEN_TEST_ARCH-guest" \
            --target "$LIMEN_TEST_TARGET" --tests --no-fail-fast "${profile[@]}" \
            2>&1 | tee .integration/stages/guests.log

      # Only Module needs an additional bare target on UEFI. Its preparation
      # is independent of whether ordinary guests passed.
      - name: Prepare Module target
        id: module
        if: ${{ !cancelled() && steps.runner.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$LIMEN_TEST_TARGET" == *-uefi ]]; then
            rustup target add "${LIMEN_TEST_ARCH}-unknown-none" 2>&1 | tee .integration/stages/module-target.log
          fi

      - name: Run Module guests
        id: module_guests
        if: ${{ !cancelled() && steps.module.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/.integration/module"
          config="target.$LIMEN_TEST_TARGET.runner=['$LIMEN_TEST_RUNNER','native','--evidence-root','$evidence']"
          profile=()
          if [[ "$LIMEN_TEST_PROFILE" == release ]]; then profile+=(--release); fi
          cargo -Z panic-abort-tests --config "$config" test --locked \
            --manifest-path server/tests/target/Cargo.toml -p module-guest \
            --target "$LIMEN_TEST_TARGET" --tests --no-fail-fast "${profile[@]}" \
            2>&1 | tee .integration/stages/module.log
      - name: Record stage outcomes
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BASE_TOOLS: ${{ steps.base_tools.outcome }}
          TOOLS: ${{ steps.tools.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          RUNNER: ${{ steps.runner.outcome }}
          OBSERVERS: ${{ steps.observers.outcome }}
          GUESTS: ${{ steps.guests.outcome }}
          MODULE_TARGET: ${{ steps.module.outcome }}
          MODULE_GUESTS: ${{ steps.module_guests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .integration/stages
          # These are Actions step outcomes, not individual guest verdicts.
          printf '{"base_tools":"%s","tools":"%s","toolchain":"%s","source":"%s","runner":"%s","observers":"%s","guests":"%s","module_target":"%s","module_guests":"%s"}\n' \
            "$BASE_TOOLS" "$TOOLS" "$TOOLCHAIN" "$SOURCE" "$RUNNER" "$OBSERVERS" "$GUESTS" "$MODULE_TARGET" "$MODULE_GUESTS" \
            > .integration/stages/outcomes.json
      - name: Preserve target evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: target-${{ matrix.arch }}-${{ matrix.profile }}
          path: .integration/
          include-hidden-files: true
          if-no-files-found: warn
