name: Target

on:
  pull_request:
    paths:
      - "server/src/**"
      - "treaty/src/**"
      - "treaty/Cargo.toml"
      - "server/tests/**"
      - "server/Cargo.toml"
      - "server/build.rs"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "tools/tests/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/target.yml"
  push:
    branches: [main]
    paths:
      - "server/src/**"
      - "treaty/src/**"
      - "treaty/Cargo.toml"
      - "server/tests/**"
      - "server/Cargo.toml"
      - "server/build.rs"
      - "Cargo.toml"
      - ".cargo/config.toml"
      - "tools/tests/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/target.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: kernel-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.projects.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: projects
        name: Select affected owners
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          plan="$(bash tools/tests/discover.sh "$GITHUB_WORKSPACE" "$BASE_SHA")"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$plan" == '[]' ]]; then
            echo "::error::No target suites discovered."
            exit 1
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "$plan" | jq .

  target:
    name: Selected H4 guests
    needs: discover
    if: needs.discover.outputs.plan != '[]'
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    env:
      QEMU_RISCV64: qemu-system-riscv64
      QEMU_OPENSBI: /usr/lib/riscv64-linux-gnu/opensbi/generic/fw_dynamic.bin
      PLAN: ${{ needs.discover.outputs.plan }}
    steps:
      - name: Install target tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential jq
          packages=()
          firmware=()
          for platform in $(jq -r 'map(.platform) | unique[]' <<<"$PLAN"); do
            case "$platform" in
              rv64) packages+=(qemu-system-riscv); firmware+=(opensbi) ;;
              q35)  packages+=(qemu-system-x86); firmware+=(ovmf) ;;
              virt) packages+=(qemu-system-arm); firmware+=(qemu-efi-aarch64) ;;
              host) ;;
              *) exit 2 ;;
            esac
          done
          if (( ${#firmware[@]} )); then apt-get install -y --no-install-recommends "${firmware[@]}"; fi
          if (( ${#packages[@]} )); then
            echo "deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://snapshot.debian.org/archive/debian/20261124T000000Z/ trixie-backports main" > /etc/apt/sources.list.d/qemu.list
            apt-get -o Acquire::Retries=3 update
            apt-get install -y --no-install-recommends -t trixie-backports "${packages[@]}"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          rustc -Vv
          targets=()
          for platform in $(jq -r 'map(.platform) | unique[]' <<<"$PLAN"); do
            case "$platform" in
              rv64) targets+=(riscv64gc-unknown-none-elf) ;;
              q35)  targets+=(x86_64-unknown-uefi) ;;
              virt) targets+=(aarch64-unknown-uefi) ;;
              host) ;;
              *) exit 2 ;;
            esac
          done
          if (( ${#targets[@]} )); then rustup target add "${targets[@]}"; fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run project-owned verification
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          runner="$GITHUB_WORKSPACE/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          mkdir -p "$GITHUB_WORKSPACE/.integration"
          batch_status=0
          fault_status=0
          bash tools/tests/batch.sh "$runner" "$GITHUB_WORKSPACE/.integration/evidence" || batch_status=$?
          bash server/tests/target/entry/boot/fault.sh "$runner" "$GITHUB_WORKSPACE/.integration/evidence" || fault_status=$?
          (( batch_status == 0 && fault_status == 0 ))
      - name: Preserve project evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: target-h4
          include-hidden-files: true
          path: |
            .integration/evidence/
            server/tests/target/**/target/evidence/
          if-no-files-found: warn
