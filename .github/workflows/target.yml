name: Target

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-target-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  target:
    name: ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64, x86_64]
        profile: [debug, release]
    env:
      LIMEN_TEST_ARCH: ${{ matrix.arch }}
      LIMEN_TEST_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential
          case "$LIMEN_TEST_ARCH" in
            riscv64) qemu=qemu-system-riscv; firmware="opensbi gdb-multiarch" ;;
            aarch64) qemu=qemu-system-arm; firmware=qemu-efi-aarch64 ;;
            x86_64) qemu=qemu-system-x86; firmware=ovmf ;;
          esac
          read -r -a firmware_packages <<< "$firmware"
          apt-get install -y --no-install-recommends "${firmware_packages[@]}"
          echo 'deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://snapshot.debian.org/archive/debian/20261124T000000Z/ trixie-backports main' > /etc/apt/sources.list.d/qemu.list
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends -t trixie-backports "$qemu"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          case "$LIMEN_TEST_ARCH" in
            riscv64) target=riscv64gc-unknown-none-elf ;;
            aarch64) target=aarch64-unknown-uefi ;;
            x86_64) target=x86_64-unknown-uefi ;;
          esac
          if [[ "$target" == *-uefi ]]; then
            rustup target add "$target" "${LIMEN_TEST_ARCH}-unknown-none"
          else
            rustup target add "$target"
          fi
          echo "LIMEN_TEST_TARGET=$target" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record source
        run: |
          mkdir -p .integration
          git -c safe.directory="$PWD" rev-parse HEAD > .integration/source.txt
          rustc -Vv > .integration/rustc.txt
          cargo -V > .integration/cargo.txt
      - name: Test Cargo completion transport
        run: |
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu --test contracts transport:: -- --ignored --test-threads=1 --skip transport::rejects_timeout
      - name: Test auto-discovered guests
        shell: bash
        run: |
          set -euo pipefail
          runner="$PWD/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          evidence="$PWD/.integration/guests"
          config="target.$LIMEN_TEST_TARGET.runner=['$runner','native','--evidence-root','$evidence']"
          args=()
          if [[ "$LIMEN_TEST_PROFILE" == release ]]; then args+=(--release); fi
          if [[ "$LIMEN_TEST_TARGET" == *-uefi ]]; then args+=(--test 'uefi-*'); fi
          cargo -Z panic-abort-tests --config "$config" test --locked --manifest-path server/tests/target/Cargo.toml -p kernel-guest --test 'common-*' --test "$LIMEN_TEST_ARCH-*" --target "$LIMEN_TEST_TARGET" "${args[@]}"
      - name: Observe early RV64 boot fault
        if: matrix.arch == 'riscv64'
        run: |
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu --test contracts boot_fault:: -- --ignored --test-threads=1
      - name: Preserve target evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: target-${{ matrix.arch }}-${{ matrix.profile }}
          path: .integration/
          include-hidden-files: true
          if-no-files-found: warn
