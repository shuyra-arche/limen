name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Release calls run the full workspace checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ !inputs.full && github.ref_type != 'tag' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: |
          plan=$(bash tools/tests/checks.sh "$PWD" "$BASE_SHA")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Check repository contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          bash tools/tests/layout.sh
          bash tools/tests/release.sh
          bash tools/check-layout.sh
          bash tools/check-tooling.sh
          bash tools/tests/selection.sh
      - name: Install host toolchain
        id: toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          rustc -Vv
          rustup component add rustfmt clippy
      - name: Check build profiles
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash server/tests/entry/boot/profiles.sh
      - name: Identify compiler
        id: compiler
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache host compilation
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
            server/tests/runner/target
          key: kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'server/tests/runner/Cargo.lock', '**/Cargo.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      # Formatting and static checks remain required, but do not gate
      # independent execution. Each step retains its native failure status.
      - name: Check workspace formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --all -- --check
      - name: Check runner formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path server/tests/runner/Cargo.toml --all -- --check
      - name: Check target formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path server/tests/target/Cargo.toml --all -- --check
      - name: Check execution package coverage
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          # A new test is discovered inside an existing execution package.
          # A new package is an explicit change to the compilation boundary.
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path server/tests/target/Cargo.toml |
            jq -e '
              [.packages[] | select(any(.targets[]; .kind == ["test"])) | .name]
              | sort == ["aarch64-guest", "kernel-guest", "module-guest", "riscv64-guest", "x86_64-guest"]'
          cargo metadata --locked --no-deps --format-version 1 \
            --manifest-path server/tests/runner/Cargo.toml |
            jq -e '
              [.packages[] | select(any(.targets[]; .kind == ["test"])) | .name]
              | sort == ["kernel-verification", "machine-observer"]'
      - name: Check runner
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.scope.outcome == 'success' && fromJSON(steps.scope.outputs.plan).runner }}
        run: |
          cargo clippy --locked --manifest-path server/tests/runner/Cargo.toml --workspace --all-targets --target x86_64-unknown-linux-gnu -- -Dwarnings
      - name: Test workspace Host contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.scope.outcome == 'success' && fromJSON(steps.scope.outputs.plan).host }}
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo test --locked --workspace --no-fail-fast
      - name: Test Treaty compiler contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.scope.outcome == 'success' && fromJSON(steps.scope.outputs.plan).host }}
        run: bash treaty/tests/compiler/check.sh
      - name: Test runner Host contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.scope.outcome == 'success' && fromJSON(steps.scope.outputs.plan).runner }}
        env:
          RUSTFLAGS: "-Dwarnings"
        run: cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu --no-fail-fast
      - name: Install riscv64 target
        id: riscv64
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.scope.outcome == 'success' && fromJSON(steps.scope.outputs.plan).riscv64 }}
        run: rustup target add riscv64gc-unknown-none-elf
      - name: Build riscv64 Debug
        if: ${{ !cancelled() && steps.riscv64.outcome == 'success' }}
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf
      - name: Build riscv64 Release
        if: ${{ !cancelled() && steps.riscv64.outcome == 'success' }}
        run: cargo build --locked --workspace --target riscv64gc-unknown-none-elf --release
      - name: Test Sync compiler contracts
        if: ${{ !cancelled() && steps.riscv64.outcome == 'success' }}
        run: bash server/tests/metal/sync/contracts.sh
      - name: Test Boot compiler contracts
        if: ${{ !cancelled() && steps.riscv64.outcome == 'success' }}
        run: bash server/tests/entry/boot/contracts.sh
