name: Check

# Documentation-only changes do not need Kernel builds or QEMU tests.
# Release calls run the full workspace checks.
# workflow_call intentionally remains unfiltered for releases.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

# PR updates supersede old work. Other runs have unique groups: main and
# reusable release checks must neither cancel nor evict one another from a queue.
concurrency:
  group: kernel-check-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ !inputs.full && github.ref_type != 'tag' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: |
          plan=$(bash tools/tests/checks.sh "$PWD" "$BASE_SHA")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - name: Check repository contracts
        run: |
          bash tools/tests/layout.sh
          bash tools/tests/release.sh
          bash tools/check-layout.sh
          bash tools/check-tooling.sh
          bash tools/tests/selection.sh
      - name: Install host toolchain
        run: |
          rustc -Vv
          rustup component add rustfmt clippy
      - name: Check build profiles
        run: bash server/tests/entry/boot/profiles.sh
      - name: Identify compiler
        id: compiler
        run: echo "hash=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache host compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
            server/tests/runner/target
          key: kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-${{ hashFiles('Cargo.lock', 'server/tests/runner/Cargo.lock', '**/Cargo.toml', '.github/workflows/check.yml') }}
          restore-keys: |
            kernel-host-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.hash }}-
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path server/tests/runner/Cargo.toml -- --check
          cargo fmt --manifest-path server/tests/target/Cargo.toml --all -- --check
      - name: Check runner
        if: fromJSON(steps.scope.outputs.plan).runner
        run: |
          cargo clippy --locked --manifest-path server/tests/runner/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -Dwarnings
      - name: Test host contracts
        env:
          RUSTFLAGS: "-Dwarnings"
          PLAN: ${{ steps.scope.outputs.plan }}
        run: |
          if jq -e .host <<<"$PLAN" >/dev/null; then
            # Exercise the ordinary Host default; a freestanding default
            # would make Rust's native test harness unavailable.
            cargo test --locked --workspace
            bash treaty/tests/compiler/check.sh
          fi
          if jq -e .runner <<<"$PLAN" >/dev/null; then
            cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          fi
      - name: Build RV64 workspace in both profiles
        if: fromJSON(steps.scope.outputs.plan).rv64
        run: |
          rustup target add riscv64gc-unknown-none-elf
          cargo build --locked --workspace --target riscv64gc-unknown-none-elf
          cargo build --locked --workspace --target riscv64gc-unknown-none-elf --release
          bash server/tests/metal/sync/contracts.sh
          bash server/tests/entry/boot/contracts.sh
