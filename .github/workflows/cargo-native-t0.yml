name: Cargo native T0
on:
  pull_request:
    paths:
      - ".github/workflows/cargo-native-t0.yml"
      - "server/tests/target/support/outcome/**"
      - "server/tests/target/support/discovery/**"
      - "server/tests/target/tests/**"
      - "server/tests/target/Cargo.toml"
      - "server/tests/target/Cargo.lock"
      - "server/tests/target/build.rs"
      - "server/tests/runner/**"
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64, x86_64]
        profile: [debug, release]
    env:
      LIMEN_T0_ARCH: ${{ matrix.arch }}
      LIMEN_T0_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential
          case "$LIMEN_T0_ARCH" in
            riscv64) qemu=qemu-system-riscv; firmware=opensbi ;;
            aarch64) qemu=qemu-system-arm; firmware=qemu-efi-aarch64 ;;
            x86_64) qemu=qemu-system-x86; firmware=ovmf ;;
          esac
          apt-get install -y --no-install-recommends "$firmware"
          echo 'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20261124T000000Z/ trixie-backports main' > /etc/apt/sources.list.d/qemu.list
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends -t trixie-backports "$qemu"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          case "$LIMEN_T0_ARCH" in
            riscv64) target=riscv64gc-unknown-none-elf ;;
            aarch64) target=aarch64-unknown-uefi ;;
            x86_64) target=x86_64-unknown-uefi ;;
          esac
          rustup target add "$target"
          echo "LIMEN_TEST_TARGET=$target" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test Cargo completion transport
        run: |
          cargo test --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu --test contracts transport:: -- --ignored --test-threads=1 --skip transport::rejects_timeout
      - name: Test auto-discovered guests
        shell: bash
        run: |
          set -euo pipefail
          runner="$PWD/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify"
          evidence="$PWD/.integration/t1"
          config="target.$LIMEN_TEST_TARGET.runner=['$runner','native','--evidence-root','$evidence','$LIMEN_T0_ARCH']"
          args=()
          if [[ "$LIMEN_T0_PROFILE" == release ]]; then args+=(--release); fi
          cargo -Z panic-abort-tests --config "$config" test --locked --manifest-path server/tests/target/Cargo.toml -p kernel-guest --tests --target "$LIMEN_TEST_TARGET" "${args[@]}"
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t0-${{ matrix.arch }}-${{ matrix.profile }}
          path: |
            .integration/t0/
            .integration/t1/
          include-hidden-files: true
          if-no-files-found: warn
