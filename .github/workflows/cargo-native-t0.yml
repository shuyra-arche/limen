name: Cargo native T0
on:
  pull_request:
    paths:
      - ".github/workflows/cargo-native-t0.yml"
      - "server/tests/target/support/outcome/**"
      - "server/tests/runner/native.rs"
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.arch }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [riscv64, aarch64, x86_64]
        profile: [debug, release]
    env:
      ARCH: ${{ matrix.arch }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential jq
          case "$ARCH" in
            riscv64) qemu=qemu-system-riscv; firmware=opensbi ;;
            aarch64) qemu=qemu-system-arm; firmware=qemu-efi-aarch64 ;;
            x86_64) qemu=qemu-system-x86; firmware=ovmf ;;
          esac
          apt-get install -y --no-install-recommends "$firmware"
          echo 'deb [check-valid-until=no] https://snapshot.debian.org/archive/debian/20261124T000000Z/ trixie-backports main' > /etc/apt/sources.list.d/qemu.list
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends -t trixie-backports "$qemu"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and build launcher
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
          source "$HOME/.cargo/env"
          case "$ARCH" in
            riscv64) target=riscv64gc-unknown-none-elf ;;
            aarch64) target=aarch64-unknown-uefi ;;
            x86_64) target=x86_64-unknown-uefi ;;
          esac
          rustup target add "$target"
          cargo build --locked --manifest-path server/tests/runner/Cargo.toml --target x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test Cargo completion transport
        shell: bash
        run: |
          set -euo pipefail
          runner="$PWD/server/tests/runner/target/x86_64-unknown-linux-gnu/debug/verify native"
          case "$ARCH" in
            riscv64)
              target=riscv64gc-unknown-none-elf
              manifest=server/tests/target/metal/interrupt/riscv64/ipi/Cargo.toml
              ordinary=0
              runner_variable=CARGO_TARGET_RISCV64GC_UNKNOWN_NONE_ELF_RUNNER
              ;;
            aarch64)
              target=aarch64-unknown-uefi
              manifest=server/tests/target/entry/platforms/Cargo.toml
              ordinary=0
              runner_variable=CARGO_TARGET_AARCH64_UNKNOWN_UEFI_RUNNER
              ;;
            x86_64)
              target=x86_64-unknown-uefi
              manifest=server/tests/target/entry/platforms/Cargo.toml
              ordinary=33
              runner_variable=CARGO_TARGET_X86_64_UNKNOWN_UEFI_RUNNER
              ;;
          esac
          args=(--locked --manifest-path "$manifest" --test outcome-probe --target "$target")
          [[ "$PROFILE" != release ]] || args+=(--release)
          mkdir -p .integration/t0
          # No production assertions are interpreted by the launcher. These
          # checks validate the transport itself, not the guest's business logic.
          for case in pass panic shutdown fake-log trap timeout minor-pass minor-panic reset; do
            if [[ "$case" == reset ]]; then
              export "$runner_variable=$runner --observe $ARCH"
            else
              export "$runner_variable=$runner $ARCH"
            fi
            export LIMEN_T0_CASE=$case
            export LIMEN_T0_EVIDENCE="$PWD/.integration/t0/$case"
            cargo test "${args[@]}" --no-run
            status=0
            cargo test "${args[@]}" || status=$?
            receipt="$LIMEN_T0_EVIDENCE/result.json"
            if [[ "$case" == pass || "$case" == minor-pass ]]; then
              [[ "$status" == 0 ]]
              jq -e '.status == "exited" and .code == 97 and .passed == true' "$receipt"
              continue
            fi
            [[ "$status" != 0 ]]
            jq -e '.passed == false' "$receipt"
            case "$case" in
              panic|minor-panic)
                jq -e '.status == "exited" and .code == 99' "$receipt"
                if [[ "$case" == panic ]]; then
                  grep -Fq 'T0 intentional assertion failure' "$LIMEN_T0_EVIDENCE/serial.log"
                else
                  grep -Fq 'T0 intentional minor assertion failure' "$LIMEN_T0_EVIDENCE/serial.log"
                fi
                ;;
              reset)
                jq -e '.status == "exited" and .code == 0' "$receipt"
                jq -e '.guest == true and .reason == "guest-reset"' "$LIMEN_T0_EVIDENCE/shutdown.json"
                ;;
              shutdown|fake-log) jq -e --argjson code "$ordinary" '.status == "exited" and .code == $code' "$receipt" ;;
              trap)
                jq -e '.status == "exited" and .code != 97 and .code != 99' "$receipt"
                grep -q 'FAIL Limen boot trap:' "$LIMEN_T0_EVIDENCE/serial.log"
                ;;
              timeout) jq -e '.status == "timeout"' "$receipt" ;;
            esac
          done
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t0-${{ matrix.arch }}-${{ matrix.profile }}
          path: .integration/t0/
          include-hidden-files: true
          if-no-files-found: warn
