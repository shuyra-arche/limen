[package]
name = "platform-boot"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "platform-boot"
path = "main.rs"
test = false
bench = false

[target.'cfg(target_arch = "aarch64")'.dependencies]
kernel = { path = "../../../..", features = ["qemu-virt"] }

[target.'cfg(target_os = "uefi")'.dependencies]
kernel = { path = "../../../..", features = ["qemu-q35"] }
uefi = "=0.41.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
