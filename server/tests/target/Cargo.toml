[package]
name = "kernel-guest"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[features]
# Select the measurement callback in a shared guest entry.
bench = []

[dependencies]
guest.workspace = true
kernel.workspace = true
limen-treaty.workspace = true

[target.'cfg(target_os = "uefi")'.dependencies]
uefi.workspace = true
uefi-fixture.workspace = true

[workspace]
resolver = "3"
members = [
    "aarch64",
    "module",
    "riscv64",
    "support",
    "support/uefi",
    "x86_64",
]
default-members = ["."]

[workspace.dependencies]
guest = { package = "guest-support", path = "support" }
kernel = { path = "../.." }
limen-treaty = { path = "../../../treaty" }
uefi = "=0.41.0"
uefi-fixture = { path = "support/uefi" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
