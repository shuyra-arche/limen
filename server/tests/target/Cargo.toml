[package]
name = "kernel-guest"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
kernel.workspace = true
limen-treaty.workspace = true

[target.'cfg(target_os = "uefi")'.dependencies]
uefi.workspace = true
uefi-fixture.workspace = true

[workspace]
resolver = "3"
members = ["support/uefi"]

[workspace.dependencies]
kernel = { path = "../.." }
limen-treaty = { path = "../../../treaty" }
uefi = "=0.41.0"
uefi-fixture = { path = "support/uefi" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
